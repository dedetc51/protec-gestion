x-app: &app
  image: protec-gestion:${APP_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  env_file: .env
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
  networks: [backend]
  depends_on:
    postgres: {condition: service_healthy}
services:
  app:
    <<: *app
  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
  nginx:
    image: nginx:1.28.0-alpine
    ports: ["${HTTP_BIND_IP:-127.0.0.1}:${HTTP_PORT:-8080}:80"]
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    networks: [frontend, backend]
    depends_on: [app]
    healthcheck: {test: [CMD, wget, -qO-, http://127.0.0.1/up], interval: 15s, timeout: 5s, retries: 5}
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    networks: [backend]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 10s, timeout: 5s, retries: 5}
networks:
  frontend: {}
  backend: {internal: true}
volumes:
  postgres-data: {}
